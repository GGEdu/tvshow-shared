[project]
name = "tvshow-common"
version = "0.10.2"
description = "Shared backend (SQLAlchemy Base, models, schemas, repos, auth, LLM client, series matcher) for AgenticTVShow and TelegramTVShow"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.0",
    "pydantic[email]>=2.0.0",
    "fastapi>=0.115.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=3.1.7,<4.0.0",
    # v0.10.0: LLM client + Reconciler matcher
    "httpx>=0.27.0",
    "rapidfuzz>=3.5.0",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["tvshow_common*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501", "B008"]
